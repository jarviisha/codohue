x-environment: &environment
  DATABASE_URL: "postgres://codohue:secret@postgres:5432/codohue?sslmode=disable"
  REDIS_URL: "redis://redis:6379"
  QDRANT_HOST: "qdrant"
  QDRANT_PORT: "6334"
  CODOHUE_LOG_FORMAT: "${CODOHUE_LOG_FORMAT:-text}"

x-app: &app
  restart: unless-stopped
  stop_grace_period: 40s
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    qdrant:
      condition: service_healthy

services:
  provision:
    build:
      context: .
      target: admin
    restart: "no"
    entrypoint: ["/bin/sh", "/provision/provision.sh"]
    environment:
      <<: *environment
      CODOHUE_BOOTSTRAP_USERNAME: "${CODOHUE_BOOTSTRAP_USERNAME:-owner}"
      CODOHUE_APPLICATION_NAMESPACE: "${CODOHUE_APPLICATION_NAMESPACE:-app}"
      CODOHUE_PROVISION_APPLICATION: "${CODOHUE_PROVISION_APPLICATION:-true}"
    secrets: [owner_password, admin_proxy_token, application_token]
    volumes:
      - ./deploy/provision.sh:/provision/provision.sh:ro
      - ${CODOHUE_NAMESPACE_CONFIG_PATH:-./deploy/examples/namespace.json}:/provision/namespace.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile
    restart: "no"
    environment:
      - DATABASE_URL=postgres://codohue:secret@postgres:5432/codohue?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    build:
      context: .
      target: api
    ports:
      - "${CODOHUE_API_PORT:-2001}:${CODOHUE_API_PORT:-2001}"
    environment:
      <<: *environment
      CODOHUE_ADMIN_API_KEY: "${CODOHUE_ADMIN_API_KEY:-}"
      CODOHUE_LEGACY_ADMIN_AUTH: "${CODOHUE_LEGACY_ADMIN_AUTH:-false}"
      CODOHUE_BATCH_INTERVAL_MINUTES: "${CODOHUE_BATCH_INTERVAL_MINUTES:-5}"
      CODOHUE_API_PORT: "${CODOHUE_API_PORT:-2001}"
      CODOHUE_CATALOG_MAX_CONTENT_BYTES: "${CODOHUE_CATALOG_MAX_CONTENT_BYTES:-32768}"
      CODOHUE_STREAM_RETENTION_ENABLED: "${CODOHUE_STREAM_RETENTION_ENABLED:-false}"
      CODOHUE_STREAM_RETENTION_INTERVAL: "${CODOHUE_STREAM_RETENTION_INTERVAL:-1m}"
      CODOHUE_OBSERVABILITY_TOKEN: "${CODOHUE_OBSERVABILITY_TOKEN:-}"
      CODOHUE_INGEST_REPLICA_NAME: "${CODOHUE_INGEST_REPLICA_NAME:-}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${CODOHUE_API_PORT:-2001}/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  cron:
    <<: *app
    build:
      context: .
      target: cron
    environment:
      <<: *environment
      CODOHUE_BATCH_INTERVAL_MINUTES: "${CODOHUE_BATCH_INTERVAL_MINUTES:-5}"
      CODOHUE_BATCH_RUN_RETENTION_DAYS: "${CODOHUE_BATCH_RUN_RETENTION_DAYS:-30}"
      CODOHUE_BACKLOG_SAMPLES_RETENTION_DAYS: "${CODOHUE_BACKLOG_SAMPLES_RETENTION_DAYS:-7}"
      CODOHUE_RETENTION_INTERVAL: "${CODOHUE_RETENTION_INTERVAL:-1h}"

  embedder:
    <<: *app
    build:
      context: .
      target: embedder
    ports:
      - "127.0.0.1:${CODOHUE_EMBEDDER_HEALTH_PORT:-2003}:${CODOHUE_EMBEDDER_HEALTH_PORT:-2003}"
    environment:
      <<: *environment
      CODOHUE_EMBED_MAX_ATTEMPTS: "${CODOHUE_EMBED_MAX_ATTEMPTS:-5}"
      CODOHUE_EMBEDDER_HEALTH_PORT: "${CODOHUE_EMBEDDER_HEALTH_PORT:-2003}"
      CODOHUE_EMBEDDER_REPLICA_NAME: "${CODOHUE_EMBEDDER_REPLICA_NAME:-}"
      CODOHUE_EMBEDDER_POLL_INTERVAL: "${CODOHUE_EMBEDDER_POLL_INTERVAL:-30s}"
      CODOHUE_STREAM_RETENTION_ENABLED: "${CODOHUE_STREAM_RETENTION_ENABLED:-false}"
      CODOHUE_STREAM_RETENTION_INTERVAL: "${CODOHUE_STREAM_RETENTION_INTERVAL:-1m}"
      CODOHUE_OBSERVABILITY_TOKEN: "${CODOHUE_OBSERVABILITY_TOKEN:-}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${CODOHUE_EMBEDDER_HEALTH_PORT:-2003}/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  admin:
    <<: *app
    build:
      context: .
      target: admin
    ports:
      - "127.0.0.1:${CODOHUE_ADMIN_PORT:-2002}:${CODOHUE_ADMIN_PORT:-2002}"
    environment:
      <<: *environment
      CODOHUE_ADMIN_API_KEY: "${CODOHUE_ADMIN_API_KEY:-}"
      CODOHUE_LEGACY_ADMIN_AUTH: "${CODOHUE_LEGACY_ADMIN_AUTH:-false}"
      CODOHUE_API_URL: "http://api:${CODOHUE_API_PORT:-2001}"
      CODOHUE_ADMIN_PORT: "${CODOHUE_ADMIN_PORT:-2002}"
      CODOHUE_ADMIN_PROXY_TOKEN_FILE: /run/secrets/admin_proxy_token
      CODOHUE_ADMIN_COOKIE_SECURE: "${CODOHUE_ADMIN_COOKIE_SECURE:-false}"
      CODOHUE_TRUSTED_PROXIES: "${CODOHUE_TRUSTED_PROXIES:-}"
      CODOHUE_OBSERVABILITY_TOKEN: "${CODOHUE_OBSERVABILITY_TOKEN:-}"
    secrets: [admin_proxy_token]
    depends_on:
      provision:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${CODOHUE_ADMIN_PORT:-2002}/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # Live Bluesky firehose → codohue:events + codohue:catalog. Off unless its
  # profile is enabled: set COMPOSE_PROFILES=bskyfeed in .env to turn it on.
  bskyfeed:
    <<: *app
    profiles: ["bskyfeed"]
    build:
      context: .
      target: bskyfeed
    environment:
      REDIS_URL: "redis://redis:6379"
      CODOHUE_ADMIN_API_KEY: "${CODOHUE_BSKY_PROVISION_TOKEN:-}"
      CODOHUE_ADMIN_URL: "http://admin:${CODOHUE_ADMIN_PORT:-2002}"
      CODOHUE_BSKY_NAMESPACE: "${CODOHUE_BSKY_NAMESPACE:-bluesky}"
      CODOHUE_BSKY_SAMPLE_PERCENT: "${CODOHUE_BSKY_SAMPLE_PERCENT:-100}"
      CODOHUE_BSKY_EMBEDDING_DIM: "${CODOHUE_BSKY_EMBEDDING_DIM:-256}"
      CODOHUE_BSKY_BOOTSTRAP: "${CODOHUE_BSKY_BOOTSTRAP:-false}"
      CODOHUE_BSKY_JETSTREAM_URL: "${CODOHUE_BSKY_JETSTREAM_URL:-}"
    # Bootstrap provisions the namespace through the admin plane, so admin must
    # be serving before the feeder starts.
    depends_on:
      admin:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codohue
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: codohue
    ports:
      - "127.0.0.1:${CODOHUE_POSTGRES_PUBLISHED_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codohue -d codohue"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${CODOHUE_REDIS_PUBLISHED_PORT:-6379}:6379"
    # Retention owns stream reclamation. Redis must reject writes under memory
    # pressure instead of silently evicting stream or queue keys.
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.17.1
    ports:
      - "127.0.0.1:${CODOHUE_QDRANT_HTTP_PUBLISHED_PORT:-6333}:6333"   # HTTP
      - "127.0.0.1:${CODOHUE_QDRANT_GRPC_PUBLISHED_PORT:-6334}:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

    healthcheck:
      # The upstream image has bash, but neither curl nor wget.
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/6333;
          printf "GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3;
          head -n 1 <&3 | grep -q " 200 "'
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

secrets:
  owner_password:
    file: ${CODOHUE_OWNER_PASSWORD_PATH:-./.secrets/owner_password}
  admin_proxy_token:
    file: ${CODOHUE_PROXY_TOKEN_PATH:-./.secrets/admin_proxy_token}
  application_token:
    file: ${CODOHUE_APPLICATION_TOKEN_PATH:-./.secrets/application_token}
