services:
  api:
    image: ghcr.io/jarviisha/codohue/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${CODOHUE_API_PUBLISHED_PORT:-2001}:2001"
    environment:
      - DATABASE_URL=${CODOHUE_DATABASE_URL:-postgres://codohue:${CODOHUE_POSTGRES_PASSWORD:-}@postgres:5432/codohue?sslmode=disable}
      - REDIS_URL=${CODOHUE_REDIS_URL:-redis://redis:6379}
      - QDRANT_HOST=${CODOHUE_QDRANT_HOST:-qdrant}
      - QDRANT_PORT=${CODOHUE_QDRANT_PORT:-6334}
      - CODOHUE_ADMIN_API_KEY=${CODOHUE_ADMIN_API_KEY:?set CODOHUE_ADMIN_API_KEY to the production admin API key}
      - CODOHUE_LOG_FORMAT=json
      - CODOHUE_BATCH_INTERVAL_MINUTES=${CODOHUE_BATCH_INTERVAL_MINUTES:-5}
      - CODOHUE_CATALOG_MAX_CONTENT_BYTES=${CODOHUE_CATALOG_MAX_CONTENT_BYTES:-32768}
      - CODOHUE_STREAM_RETENTION_ENABLED=${CODOHUE_STREAM_RETENTION_ENABLED:-false}
      - CODOHUE_STREAM_RETENTION_INTERVAL=${CODOHUE_STREAM_RETENTION_INTERVAL:-1m}
      - CODOHUE_OBSERVABILITY_TOKEN=${CODOHUE_OBSERVABILITY_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
        # Ignored when the local-redis profile is off (external Redis mode).
        required: false
      qdrant:
        condition: service_healthy
        # Ignored when the local-qdrant profile is off (external Qdrant mode).
        required: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2001/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  cron:
    image: ghcr.io/jarviisha/codohue/cron:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - DATABASE_URL=${CODOHUE_DATABASE_URL:-postgres://codohue:${CODOHUE_POSTGRES_PASSWORD:-}@postgres:5432/codohue?sslmode=disable}
      - REDIS_URL=${CODOHUE_REDIS_URL:-redis://redis:6379}
      - QDRANT_HOST=${CODOHUE_QDRANT_HOST:-qdrant}
      - QDRANT_PORT=${CODOHUE_QDRANT_PORT:-6334}
      - CODOHUE_LOG_FORMAT=json
      - CODOHUE_BATCH_INTERVAL_MINUTES=${CODOHUE_BATCH_INTERVAL_MINUTES:-5}
      - CODOHUE_BATCH_RUN_RETENTION_DAYS=${CODOHUE_BATCH_RUN_RETENTION_DAYS:-30}
      - CODOHUE_BACKLOG_SAMPLES_RETENTION_DAYS=${CODOHUE_BACKLOG_SAMPLES_RETENTION_DAYS:-7}
      - CODOHUE_RETENTION_INTERVAL=${CODOHUE_RETENTION_INTERVAL:-1h}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
        required: false
      qdrant:
        condition: service_healthy
        required: false

  embedder:
    image: ghcr.io/jarviisha/codohue/embedder:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CODOHUE_EMBEDDER_PUBLISHED_PORT:-2003}:2003"
    environment:
      - DATABASE_URL=${CODOHUE_DATABASE_URL:-postgres://codohue:${CODOHUE_POSTGRES_PASSWORD:-}@postgres:5432/codohue?sslmode=disable}
      - REDIS_URL=${CODOHUE_REDIS_URL:-redis://redis:6379}
      - QDRANT_HOST=${CODOHUE_QDRANT_HOST:-qdrant}
      - QDRANT_PORT=${CODOHUE_QDRANT_PORT:-6334}
      - CODOHUE_LOG_FORMAT=json
      - CODOHUE_CATALOG_MAX_CONTENT_BYTES=${CODOHUE_CATALOG_MAX_CONTENT_BYTES:-32768}
      - CODOHUE_EMBED_MAX_ATTEMPTS=${CODOHUE_EMBED_MAX_ATTEMPTS:-5}
      - CODOHUE_STREAM_RETENTION_ENABLED=${CODOHUE_STREAM_RETENTION_ENABLED:-false}
      - CODOHUE_STREAM_RETENTION_INTERVAL=${CODOHUE_STREAM_RETENTION_INTERVAL:-1m}
      - CODOHUE_OBSERVABILITY_TOKEN=${CODOHUE_OBSERVABILITY_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
        required: false
      qdrant:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2003/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  admin:
    image: ghcr.io/jarviisha/codohue/admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${CODOHUE_ADMIN_PUBLISHED_PORT:-2002}:2002"
    environment:
      - DATABASE_URL=${CODOHUE_DATABASE_URL:-postgres://codohue:${CODOHUE_POSTGRES_PASSWORD:-}@postgres:5432/codohue?sslmode=disable}
      - REDIS_URL=${CODOHUE_REDIS_URL:-redis://redis:6379}
      - QDRANT_HOST=${CODOHUE_QDRANT_HOST:-qdrant}
      - QDRANT_PORT=${CODOHUE_QDRANT_PORT:-6334}
      - CODOHUE_ADMIN_API_KEY=${CODOHUE_ADMIN_API_KEY:?set CODOHUE_ADMIN_API_KEY to the production admin API key}
      - CODOHUE_API_URL=http://api:2001
      - CODOHUE_ADMIN_PORT=2002
      - CODOHUE_LOG_FORMAT=json
      - CODOHUE_ADMIN_SESSION_SECRET=${CODOHUE_ADMIN_SESSION_SECRET:-}
    healthcheck:
      # cmd/admin has no unauthenticated /healthz; the embedded SPA index
      # doubles as the liveness probe.
      test: ["CMD", "wget", "-qO-", "http://localhost:2002/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
        required: false
      qdrant:
        condition: service_healthy
        required: false

  migrate:
    image: ghcr.io/jarviisha/codohue/migrate:${IMAGE_TAG:-latest}
    restart: on-failure
    environment:
      - DATABASE_URL=${CODOHUE_DATABASE_URL:-postgres://codohue:${CODOHUE_POSTGRES_PASSWORD:-}@postgres:5432/codohue?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
        # Ignored when the local-db profile is off (external Postgres mode).
        required: false

  # ── Infra placement ────────────────────────────────────────────────────────
  # Each infra service is optional and gated by a compose profile; where the
  # apps connect is a separate env var with an in-compose default. Pick any
  # combination via .env:
  #
  #   in-compose:  add the profile to COMPOSE_PROFILES (e.g.
  #                COMPOSE_PROFILES=local-db,local-redis,local-qdrant for the
  #                full self-contained stack) and leave the URL var unset.
  #   external:    omit the profile and point the URL var at the external
  #                instance (CODOHUE_DATABASE_URL / CODOHUE_REDIS_URL /
  #                CODOHUE_QDRANT_HOST+CODOHUE_QDRANT_PORT).
  #
  # All four binaries must share ONE Postgres + ONE Redis + ONE Qdrant — they
  # coordinate through them (streams, pub/sub bridges, heartbeats).
  postgres:
    image: postgres:16-alpine
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      - POSTGRES_USER=codohue
      - POSTGRES_PASSWORD=${CODOHUE_POSTGRES_PASSWORD:-}
      - POSTGRES_DB=codohue
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${CODOHUE_POSTGRES_PUBLISHED_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codohue -d codohue"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    profiles: ["local-redis"]
    restart: unless-stopped
    # Retention owns stream reclamation. noeviction makes every producer see
    # an explicit write failure under pressure; queue data is never discarded.
    command: redis-server --appendonly yes --maxmemory ${CODOHUE_REDIS_MAXMEMORY:-256mb} --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.17.1
    profiles: ["local-qdrant"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CODOHUE_QDRANT_HTTP_PUBLISHED_PORT:-6333}:6333"
      - "127.0.0.1:${CODOHUE_QDRANT_GRPC_PUBLISHED_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The qdrant image ships neither curl nor wget; probe the REST port
      # with bash's /dev/tcp instead.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  redis_data:
  qdrant_data:
  postgres_data:
