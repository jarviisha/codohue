<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codohue Admin</title>
    <script>
      // Astryx's <Theme> syncs data-theme onto <html>, but only after React
      // mounts. Setting it here, synchronously before paint, avoids the
      // light → dark flash on reload for an explicitly stored preference.
      // "system" deliberately leaves the attribute off so the reset's
      // `color-scheme: light dark` default applies.
      // Storage key must match src/services/themeMode.ts.
      (function(){try{var s=localStorage.getItem("codohue-admin-theme");if(s==="light"||s==="dark"){document.documentElement.setAttribute("data-theme",s);}}catch(e){}})();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
