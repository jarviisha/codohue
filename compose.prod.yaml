x-environment: &environment
  DATABASE_URL: "${CODOHUE_DATABASE_URL:-postgres://codohue:${CODOHUE_POSTGRES_PASSWORD:-}@postgres:5432/codohue?sslmode=disable}"
  REDIS_URL: "${CODOHUE_REDIS_URL:-redis://redis:6379}"
  QDRANT_HOST: "${CODOHUE_QDRANT_HOST:-qdrant}"
  QDRANT_PORT: "${CODOHUE_QDRANT_PORT:-6334}"
  CODOHUE_LOG_FORMAT: "json"

x-app: &app
  restart: unless-stopped
  stop_grace_period: 40s
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
      required: false
    qdrant:
      condition: service_healthy
      required: false

services:
  provision:
    image: ghcr.io/jarviisha/codohue/admin:${IMAGE_TAG:-latest}
    restart: "no"
    entrypoint: ["/bin/sh", "/provision/provision.sh"]
    environment:
      <<: *environment
      CODOHUE_BOOTSTRAP_USERNAME: "${CODOHUE_BOOTSTRAP_USERNAME:-owner}"
      CODOHUE_APPLICATION_NAMESPACE: "${CODOHUE_APPLICATION_NAMESPACE:-app}"
      CODOHUE_PROVISION_APPLICATION: "${CODOHUE_PROVISION_APPLICATION:-true}"
    secrets: [owner_password, admin_proxy_token, application_token]
    volumes:
      - ./deploy/provision.sh:/provision/provision.sh:ro
      - ${CODOHUE_NAMESPACE_CONFIG_PATH:-./deploy/examples/namespace.json}:/provision/namespace.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *app
    image: ghcr.io/jarviisha/codohue/api:${IMAGE_TAG:-latest}
    ports:
      - "${CODOHUE_API_PUBLISHED_PORT:-2001}:2001"
    environment:
      <<: *environment
      CODOHUE_ENV: "production"
      CODOHUE_BATCH_INTERVAL_MINUTES: "${CODOHUE_BATCH_INTERVAL_MINUTES:-5}"
      CODOHUE_CATALOG_MAX_CONTENT_BYTES: "${CODOHUE_CATALOG_MAX_CONTENT_BYTES:-32768}"
      CODOHUE_STREAM_RETENTION_ENABLED: "${CODOHUE_STREAM_RETENTION_ENABLED:-false}"
      CODOHUE_STREAM_RETENTION_INTERVAL: "${CODOHUE_STREAM_RETENTION_INTERVAL:-1m}"
      CODOHUE_OBSERVABILITY_TOKEN: "${CODOHUE_OBSERVABILITY_TOKEN:-}"
      CODOHUE_INGEST_REPLICA_NAME: "${CODOHUE_INGEST_REPLICA_NAME:-}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2001/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  cron:
    <<: *app
    image: ghcr.io/jarviisha/codohue/cron:${IMAGE_TAG:-latest}
    # A batch run holds the namespace writer lease for its whole recompute,
    # which starves provision's exclusive Activate and times it out in 60s.
    # Waiting for provision (which itself waits for migrate) keeps the order.
    depends_on:
      provision:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
        required: false
      qdrant:
        condition: service_healthy
        required: false
    environment:
      <<: *environment
      CODOHUE_BATCH_INTERVAL_MINUTES: "${CODOHUE_BATCH_INTERVAL_MINUTES:-5}"
      CODOHUE_BATCH_RUN_RETENTION_DAYS: "${CODOHUE_BATCH_RUN_RETENTION_DAYS:-30}"
      CODOHUE_BACKLOG_SAMPLES_RETENTION_DAYS: "${CODOHUE_BACKLOG_SAMPLES_RETENTION_DAYS:-7}"
      CODOHUE_RETENTION_INTERVAL: "${CODOHUE_RETENTION_INTERVAL:-1h}"

  embedder:
    <<: *app
    image: ghcr.io/jarviisha/codohue/embedder:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:${CODOHUE_EMBEDDER_PUBLISHED_PORT:-2003}:2003"
    environment:
      <<: *environment
      CODOHUE_EMBED_MAX_ATTEMPTS: "${CODOHUE_EMBED_MAX_ATTEMPTS:-5}"
      CODOHUE_STREAM_RETENTION_ENABLED: "${CODOHUE_STREAM_RETENTION_ENABLED:-false}"
      CODOHUE_STREAM_RETENTION_INTERVAL: "${CODOHUE_STREAM_RETENTION_INTERVAL:-1m}"
      CODOHUE_OBSERVABILITY_TOKEN: "${CODOHUE_OBSERVABILITY_TOKEN:-}"
      CODOHUE_EMBEDDER_REPLICA_NAME: "${CODOHUE_EMBEDDER_REPLICA_NAME:-}"
      CODOHUE_EMBEDDER_POLL_INTERVAL: "${CODOHUE_EMBEDDER_POLL_INTERVAL:-30s}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2003/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  admin:
    <<: *app
    image: ghcr.io/jarviisha/codohue/admin:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:${CODOHUE_ADMIN_PUBLISHED_PORT:-2002}:2002"
    environment:
      <<: *environment
      CODOHUE_ENV: "production"
      CODOHUE_API_URL: "http://api:2001"
      CODOHUE_ADMIN_PORT: "2002"
      CODOHUE_ADMIN_PROXY_TOKEN_FILE: /run/secrets/admin_proxy_token
      CODOHUE_ADMIN_COOKIE_SECURE: "${CODOHUE_ADMIN_COOKIE_SECURE:-false}"
      CODOHUE_TRUSTED_PROXIES: "${CODOHUE_TRUSTED_PROXIES:-}"
      CODOHUE_OBSERVABILITY_TOKEN: "${CODOHUE_OBSERVABILITY_TOKEN:-}"
    healthcheck:
      # cmd/admin has no unauthenticated /healthz; the embedded SPA index
      # doubles as the liveness probe.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2002/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    secrets: [admin_proxy_token]
    depends_on:
      provision:
        condition: service_completed_successfully
      api:
        condition: service_healthy

  # Development data source: live Bluesky firehose → codohue:events +
  # codohue:catalog. Off unless "bskyfeed" is in COMPOSE_PROFILES; see
  # .env.example. Not part of a release — its image is GHCR-only.
  bskyfeed:
    <<: *app
    image: ghcr.io/jarviisha/codohue/bskyfeed:${IMAGE_TAG:-latest}
    profiles: ["bskyfeed"]
    environment:
      REDIS_URL: "${CODOHUE_REDIS_URL:-redis://redis:6379}"
      CODOHUE_ADMIN_API_KEY: "${CODOHUE_BSKY_PROVISION_TOKEN:-}"
      CODOHUE_ADMIN_URL: "http://admin:2002"
      CODOHUE_BSKY_NAMESPACE: "${CODOHUE_BSKY_NAMESPACE:-bluesky}"
      CODOHUE_BSKY_SAMPLE_PERCENT: "${CODOHUE_BSKY_SAMPLE_PERCENT:-100}"
      CODOHUE_BSKY_EMBEDDING_DIM: "${CODOHUE_BSKY_EMBEDDING_DIM:-256}"
      CODOHUE_BSKY_BOOTSTRAP: "${CODOHUE_BSKY_BOOTSTRAP:-false}"
      CODOHUE_BSKY_JETSTREAM_URL: "${CODOHUE_BSKY_JETSTREAM_URL:-}"
    # Bootstrap provisions the namespace through the admin plane.
    depends_on:
      admin:
        condition: service_healthy

  migrate:
    image: ghcr.io/jarviisha/codohue/migrate:${IMAGE_TAG:-latest}
    restart: "no"
    environment:
      - DATABASE_URL=${CODOHUE_MIGRATION_DATABASE_URL:-${CODOHUE_DATABASE_URL:-postgres://codohue:${CODOHUE_POSTGRES_PASSWORD:-}@postgres:5432/codohue?sslmode=disable}}
    depends_on:
      postgres:
        condition: service_healthy
        # Ignored when the local-db profile is off (external Postgres mode).
        required: false

  # Enable local infra with COMPOSE_PROFILES; see .env.example.
  postgres:
    image: postgres:16-alpine
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      - POSTGRES_USER=codohue
      - POSTGRES_PASSWORD=${CODOHUE_POSTGRES_PASSWORD:-}
      - POSTGRES_DB=codohue
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${CODOHUE_POSTGRES_PUBLISHED_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codohue -d codohue"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    profiles: ["local-redis"]
    restart: unless-stopped
    # Retention owns stream reclamation. noeviction makes every producer see
    # an explicit write failure under pressure; queue data is never discarded.
    command: redis-server --appendonly yes --maxmemory ${CODOHUE_REDIS_MAXMEMORY:-256mb} --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.17.1
    profiles: ["local-qdrant"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CODOHUE_QDRANT_HTTP_PUBLISHED_PORT:-6333}:6333"
      - "127.0.0.1:${CODOHUE_QDRANT_GRPC_PUBLISHED_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The upstream image has bash, but neither curl nor wget.
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/6333;
          printf "GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3;
          head -n 1 <&3 | grep -q " 200 "'
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  redis_data:
  qdrant_data:
  postgres_data:

secrets:
  owner_password:
    file: ${CODOHUE_OWNER_PASSWORD_PATH:-./.secrets/owner_password}
  admin_proxy_token:
    file: ${CODOHUE_PROXY_TOKEN_PATH:-./.secrets/admin_proxy_token}
  application_token:
    file: ${CODOHUE_APPLICATION_TOKEN_PATH:-./.secrets/application_token}
