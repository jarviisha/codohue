services:
  api:
    build:
      context: .
      target: api
    container_name: codohue-api
    network_mode: host
    extra_hosts:
      - "host.docker.internal:127.0.0.1"
    env_file:
      - path: .env
        required: false
      - path: .env.app
        required: false
    environment:
      - CODOHUE_STREAM_RETENTION_ENABLED=${CODOHUE_STREAM_RETENTION_ENABLED:-false}
      - CODOHUE_STREAM_RETENTION_INTERVAL=${CODOHUE_STREAM_RETENTION_INTERVAL:-1m}
      - CODOHUE_OBSERVABILITY_TOKEN=${CODOHUE_OBSERVABILITY_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${CODOHUE_API_PORT:-2001}/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  cron:
    build:
      context: .
      target: cron
    container_name: codohue-cron
    network_mode: host
    extra_hosts:
      - "host.docker.internal:127.0.0.1"
    env_file:
      - path: .env
        required: false
      - path: .env.app
        required: false
  embedder:
    build:
      context: .
      target: embedder
    container_name: codohue-embedder
    network_mode: host
    extra_hosts:
      - "host.docker.internal:127.0.0.1"
    env_file:
      - path: .env
        required: false
      - path: .env.app
        required: false
    environment:
      - CODOHUE_STREAM_RETENTION_ENABLED=${CODOHUE_STREAM_RETENTION_ENABLED:-false}
      - CODOHUE_STREAM_RETENTION_INTERVAL=${CODOHUE_STREAM_RETENTION_INTERVAL:-1m}
      - CODOHUE_OBSERVABILITY_TOKEN=${CODOHUE_OBSERVABILITY_TOKEN:-}

  admin:
    build:
      context: .
      target: admin
    container_name: codohue-admin
    network_mode: host
    extra_hosts:
      - "host.docker.internal:127.0.0.1"
    env_file:
      - path: .env
        required: false
      - path: .env.app
        required: false
    depends_on:
      api:
        condition: service_healthy
