# Manual deploy. Images are published automatically by the Build images
# workflow; putting them on a host is always an explicit operator action.
# Pick any published tag, which also makes rollback a normal deploy.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - development
          - production
        default: development
      image_tag:
        description: 'Published image tag, e.g. development-1a2b3c4 or v0.10.0'
        required: true
        type: string

# One deploy per environment at a time. Queue rather than cancel: a cancelled
# run leaves the stack mid-converge.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # VPS_* secrets are environment-scoped; both environments may point at the
    # same host, so each stack gets its own directory (compose derives the
    # project name from the directory, keeping containers/volumes/networks
    # separate). DEPLOY_DIR keeps its /opt/codohue-dev path on purpose —
    # renaming it would start a fresh compose project with empty volumes; the
    # dir is internal and decoupled from the environment name.
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: ${{ inputs.environment == 'development' && '/opt/codohue-dev' || '/opt/codohue-prod' }}
    steps:
      # Checks out the ref this workflow was dispatched from (main by default).
      # The compose file and deploy script come from that ref; the image tag is
      # chosen independently, so an old image can be redeployed with the
      # current deploy tooling.
      - uses: actions/checkout@v4

      - name: Copy compose file and deploy script to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "docker-compose.prod.yml,deploy/deploy.sh"
          target: ${{ env.DEPLOY_DIR }}/
          overwrite: true

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: IMAGE_TAG
          # First deploys pull five images before compose converges; the
          # action's 10m default is too tight for that on a small instance.
          command_timeout: 30m
          script: |
            set -euo pipefail
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            IMAGE_TAG="${IMAGE_TAG}" bash ${{ env.DEPLOY_DIR }}/deploy/deploy.sh
            docker logout ghcr.io

      - name: Summarize the deploy
        if: always()
        run: |
          {
            echo "### Deploy ${{ job.status }}"
            echo
            echo "Environment: \`${{ inputs.environment }}\`"
            echo "Image tag: \`${{ inputs.image_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
