# Builds and publishes images after CI: main pushes -> development images,
# v* tags -> release images. Deploying is a separate manual step — run the
# Deploy workflow with the tag this run printed in its summary.
name: Build images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_REPO: codohue

jobs:
  build-push:
    # event == 'push' pins this to push-triggered CI runs — without it a PR
    # from any branch whose name starts with "v" would also build and deploy.
    # main pushes produce development images; v* tag pushes produce release images.
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'main' ||
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # main   → version=development-<sha7>, alias=development, GHCR only
      # v* tag → version=<tag>,              alias=latest,      GHCR + Docker Hub
      # Emits one <image>_tags output per image with the full tag list so the
      # build steps stay registry-agnostic.
      - name: Compute image tags
        id: meta
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$HEAD_BRANCH" = "main" ]; then
            version="development-${HEAD_SHA:0:7}" alias="development" release=false
          else
            version="$HEAD_BRANCH" alias="latest" release=true
          fi
          {
            echo "version=$version"
            echo "alias=$alias"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"
          for img in api cron embedder admin migrate; do
            tags="${REGISTRY}/${IMAGE_NAME}/${img}:${alias}"$'\n'"${REGISTRY}/${IMAGE_NAME}/${img}:${version}"
            if [ "$release" = "true" ]; then
              tags+=$'\n'"${DOCKERHUB_NAMESPACE}/${DOCKERHUB_REPO}-${img}:${alias}"
              tags+=$'\n'"${DOCKERHUB_NAMESPACE}/${DOCKERHUB_REPO}-${img}:${version}"
            fi
            {
              echo "${img}_tags<<EOF"
              echo "$tags"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.meta.outputs.release == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.api_tags }}

      - name: Build and push Cron image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: cron
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.cron_tags }}

      - name: Build and push Embedder image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: embedder
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.embedder_tags }}

      - name: Build and push Admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: admin
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.admin_tags }}

      - name: Build and push Migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/migrate.Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.migrate_tags }}

      # Nothing deploys automatically, so surface the tag an operator needs to
      # feed the Deploy workflow rather than making them reconstruct it.
      - name: Summarize the published tag
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          {
            echo "### Images published"
            echo
            echo "Tag: \`${VERSION}\`"
            echo
            echo "Deploy with the **Deploy** workflow, or:"
            echo
            echo '```'
            echo "gh workflow run deploy.yml -f image_tag=${VERSION}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
